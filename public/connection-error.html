<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Conexão indisponível — Biblioteca Digital</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px;background:#0f1117;color:#e8e9f0;font-family:system-ui,sans-serif}main{width:100%;max-width:420px;padding:32px 24px;background:#191d29;border:1px solid #30364b;border-radius:20px;text-align:center}.icon{color:#eebf48;margin:0 auto 24px;width:64px;height:64px}h1{font-size:1.5rem;line-height:1.3;margin:0 0 16px}p{color:#aeb8cf;line-height:1.6;margin:12px 0}button{width:100%;min-height:48px;margin-top:20px;border:0;border-radius:10px;background:#eebf48;color:#171717;font:700 1rem system-ui;cursor:pointer}button:disabled{opacity:.65}button:focus-visible{outline:3px solid #fff;outline-offset:4px}#status{min-height:1.6em;font-size:.875rem}.brand{font-size:.8rem;margin-top:24px}
</style>
</head>
<body>
<main>
<svg class="icon" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true"><path d="M8 23c14-12 34-12 48 0M16 33c9-8 23-8 32 0M25 43c4-4 10-4 14 0M8 8l48 48"/><circle cx="32" cy="53" r="2"/></svg>
<h1>Não foi possível conectar</h1>
<p>O servidor pode estar temporariamente indisponível ou sua conexão pode ter sido interrompida.</p>
<p>Verifique sua internet e tente novamente em instantes.</p>
<button id="retry" type="button" disabled>Tentar novamente</button>
<p id="status" role="status" aria-live="polite">Preparando nova tentativa…</p>
<p class="brand">Biblioteca Digital</p>
</main>
<script>
let retryUrl;
const button = document.getElementById('retry');
const status = document.getElementById('status');
window.configureConnectionRetry = function(url) {
  const parsed = new URL(url);
  if (!['https:', 'http:'].includes(parsed.protocol)) return;
  retryUrl = parsed.href;
  button.disabled = false;
  status.textContent = '';
};
button.addEventListener('click', () => {
  if (!retryUrl || button.disabled) return;
  button.disabled = true;
  status.textContent = 'Conectando…';
  window.location.replace(retryUrl);
});
</script>
</body>
</html>
